name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    env:
      # Keep the API tests off any proxy the runner may have configured.
      # Env keys are case-insensitive in workflows, so this must appear once.
      NO_PROXY: 127.0.0.1,localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: PDF pipeline tests
        run: python tests/smoke_test.py

      - name: Start the app in the background
        shell: bash
        run: python run.py --no-browser --port 8765 > server.log 2>&1 &

      - name: Wait for the server
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            if python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2).status == 200 else 1)" 2>/dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 0.5
          done
          echo "server never came up"; cat server.log; exit 1

      - name: HTTP API tests
        run: python tests/api_test.py http://127.0.0.1:8765

      - name: Show server log
        if: always()
        shell: bash
        run: cat server.log || true
